name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write  # prefix.dev trusted publishing

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a Mesa cache miss compiles Mesa (LLVM) from source
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
      - run: pixi run package
      # Mesa only changes when its recipe does, so reuse the built package otherwise.
      - name: Restore Mesa package
        id: mesa-cache
        uses: actions/cache/restore@v4
        with:
          path: output-mesa
          key: mesa-${{ runner.os }}-${{ hashFiles('packages/mesa/**') }}
      - name: Build Mesa
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: pixi build --path packages/mesa --output-dir output-mesa
      # Save right away so a failure in a later step doesn't throw the build away.
      - name: Save Mesa package
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: output-mesa
          key: ${{ steps.mesa-cache.outputs.cache-primary-key }}
      - name: Publish to prefix.dev/nandi-testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # An empty PREFIX_API_KEY is sent as a (bad) key; unset it to fall back to OIDC.
          [ -n "$PREFIX_API_KEY" ] || unset PREFIX_API_KEY
          # Skips files already on the channel; bump the version or build number to publish a new build.
          pixi exec rattler-build upload prefix -c nandi-testing --skip-existing $(find output output-mesa -name "*.conda")
          # Copy the conda-forge runtime dependencies too, so the channel installs on its own.
          ci/fetch-deps.sh nandi-testing deps output output-mesa
          if [ -n "$(ls deps)" ]; then pixi exec rattler-build upload prefix -c nandi-testing --skip-existing deps/*; fi
        shell: bash
        env:
          # Optional; if unset, rattler-build uses trusted publishing (OIDC).
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: |
            output/**/*.conda
            output-mesa/**/*.conda
