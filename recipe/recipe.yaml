# Built by pixi-build (pixi-build-rattler-build); run `pixi run package`.
context:
  name: pavucontrol_flutter
  version: "2.0.0"
  app_id: dev.v.pavucontrol_flutter

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - nim >=2.2
    - pkg-config
  host:
    - gtk3
    - glib >=2.90.0,<3
    # libpulse headers and .pc files; at runtime the app links pulseaudio-libs' copy
    - pulseaudio-client
    # .pc files that gtk3's Requires(.private) chain needs; conda splits them from lib* runtime pkgs
    - zlib
    - expat
    - libpng
    - freetype
    - libffi
    - pcre2
    - bzip2
  run:
    - gtk3
    - glib >=2.90.0,<3
    - pulseaudio-libs  # libpulse.so.0 + libpulse-mainloop-glib.so.0 without pactl & co; packages/pulseaudio-libs
  ignore_run_exports:
    from_package:
      - pulseaudio-client

tests:
  - package_contents:
      bin:
        - pavucontrol_flutter
      files:
        - share/applications/${{ app_id }}.desktop
        - share/icons/hicolor/scalable/apps/${{ app_id }}.svg
        - Menu/${{ name }}.json
        - Menu/${{ app_id }}.png

about:
  summary: Volume control for PulseAudio / PipeWire (a pavucontrol clone in Nim, on nimkit)
  homepage: https://github.com/nandi-conda/pavucontrol_flutter
