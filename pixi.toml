[workspace]
preview = ["pixi-build"]
name = "volume"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
nim = ">=2.2"
c-compiler = "*"
pkg-config = "*"
gtk3 = "*"
glib = ">=2.90.0,<3"
pulseaudio-client = "*"  # libpulse headers and libpulse.so.0 for `pixi run`; installs ship pulseaudio-libs instead
# .pc files that gtk3's Requires(.private) chain needs; conda splits them from lib* runtime pkgs
zlib = "*"
expat = "*"
libpng = "*"
freetype = "*"
libffi = "*"
pcre2 = "*"
bzip2 = "*"

[package]
name = "volume"
version = "2.0.0"

# Built from source by recipe/recipe.yaml.
[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[tasks]
deps = "git submodule update --init vendor/webby"
build = { cmd = "nim c -d:release --hints:off -o:build/volume src/volume.nim", depends-on = ["deps"] }
run = { cmd = "./build/volume", depends-on = ["build"] }
volume = { cmd = "./build/volume", depends-on = ["build"], description = "Build and launch the app" }
mock = { cmd = "./build/volume", env = { PAVU_MOCK = "1" }, depends-on = ["build"] }
test = { cmd = "nim r --hints:off tests/test_model.nim", depends-on = ["deps"] }
install-desktop = { cmd = "packaging/install-local.sh", depends-on = ["build"] }
package = "pixi build --output-dir output"
package-mesa = "pixi build --path packages/mesa --output-dir output"
package-pulseaudio-libs = "pixi build --path packages/pulseaudio-libs --output-dir output"
ci = { depends-on = ["package", "package-mesa", "package-pulseaudio-libs"] }
