[workspace]
preview = ["pixi-build"]
name = "pavucontrol_flutter"
channels = ["conda-forge", "https://prefix.dev/hadron"]
platforms = ["linux-64"]

[dependencies]
flutter-sdk = "*"  # from the hadron channel
patchelf = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
clangxx = "*"
gtk3 = "*"
pulseaudio-client = "*"  # provides pactl at runtime
glib = ">=2.90.0,<3"

[package]
name = "pavucontrol_flutter"
version = "1.0.0"

# Built from source by recipe/recipe.yaml.
[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[tasks]
deps = "flutter pub get"
run = { cmd = "flutter run -d linux", depends-on = ["deps"] }
test = { cmd = "flutter test", depends-on = ["deps"] }
build = { cmd = "flutter build linux --release", depends-on = ["deps"] }
install-desktop = { cmd = "linux/packaging/install-local.sh", depends-on = ["build"] }
package = "pixi build --output-dir output"
package-mesa = "pixi build --path packages/mesa --output-dir output"
ci = { depends-on = ["package", "package-mesa"] }
